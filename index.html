<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpers — тестовые данные РБ</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <p class="brand">Helpers</p>
        <p class="brand-note">Генераторы для тестирования</p>
        <nav class="nav" data-nav aria-label="Список хелперов"></nav>
      </aside>

      <main class="workspace">
        <header class="workspace-header">
          <h1 data-title>Хелпер</h1>
          <p data-description></p>
        </header>

        <form class="panel" data-form>
          <div class="fields" data-fields></div>
          <button class="generate-button" type="submit" data-generate>Сгенерировать</button>
        </form>

        <section class="panel results" aria-live="polite">
          <h2>Результат</h2>
          <div class="results-list" data-results></div>
        </section>
      </main>

      <aside class="history" aria-label="Скопированные данные">
        <div class="history-header">
          <h2>Скопированное</h2>
          <button class="history-clear" type="button" data-history-clear>Очистить</button>
        </div>
        <div class="history-list" data-history></div>
      </aside>
    </div>

    <script src="./js/utils.js"></script>
    <script src="./js/helpers/passport.js"></script>
    <script src="./js/helpers/phone.js"></script>
    <script src="./js/helpers/unp.js"></script>
    <script src="./js/helpers/iban.js"></script>
    <script src="./js/helpers/index.js"></script>
    <script src="./js/history.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
